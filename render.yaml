databases:
  - name: e-tiri-db
    databaseName: e_tiri
    user: e_tiri
    plan: free

services:
  - type: web
    name: e-tiri
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: e-tiri-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: VITE_API_BASE_URL
        value: /api
